name: Daily Cinetel Ingest

on:
  schedule:
    - cron: "${{ vars.DAILY_CRON || '0 11 * * *' }}"  # default: 11:00 UTC = 13:00 ora italiana
  workflow_dispatch:
    inputs:
      cron_hour_utc:
        description: "Ora UTC di esecuzione (0-23). Usato solo per trigger manuale con data specifica."
        required: false
        default: "11"
      target_date:
        description: "Data da ingestire YYYY-MM-DD (default: oggi)"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      BOXOFFICE_DB_URL: ${{ secrets.BOXOFFICE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (with warehouse extras)
        run: pip install -e ".[warehouse]"

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET="${{ github.event.inputs.target_date }}"
          else
            TARGET=$(date -u '+%Y-%m-%d')
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "csv_path=data/raw/box_office_raw/cinetel_${TARGET}.csv" >> $GITHUB_OUTPUT

      - name: Ingest - Cinetel (today)
        run: boxoffice-int ingest-cinetel --date "${{ steps.date.outputs.target }}"

      - name: Load to Neon
        run: boxoffice-int load-cinetel --input "${{ steps.date.outputs.csv_path }}"

      - name: Enrich DB - TMDB metadata
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: boxoffice-int enrich-db --delay 1.0

      - name: Upload raw data artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetel-raw-${{ steps.date.outputs.target }}
          path: ${{ steps.date.outputs.csv_path }}
          retention-days: 90
